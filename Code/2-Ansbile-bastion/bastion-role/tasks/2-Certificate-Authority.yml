- name: Copy CA config file for  CA Key and Cert generation
  ansible.builtin.copy:
    src: files/ca/
    dest: "{{CA_DIR}}"

- name: ls for the CA files
  command: ls -la "{{CA_DIR}}"

- name: Generate CA Cert and Key
  command: bash -c "cfssl gencert -initca ca-csr.json | cfssljson -bare ca"
  args:
    chdir: "{{CA_DIR}}"

- name: ls for the CA files
  command: ls -la "{{CA_DIR}}"

- name: ansible copy CA files from remote to local
  fetch:
  src: "{{CA_DIR}}"
  dest: "{{CA_DIR_ANSIBLE_LOCAL}}"
