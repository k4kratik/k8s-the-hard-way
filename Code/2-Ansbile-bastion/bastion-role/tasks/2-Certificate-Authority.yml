- name: Copy CA config file for  CA Key and Cert generation
  ansible.builtin.copy:
    src: files/ca/
    dest: "{{CA_DIR}}"

- name: ls for the CA files
  command: ls -la "{{CA_DIR}}"

- name: Generate CA Cert and Key
  command: bash -c "cfssl gencert -initca ca-csr.json | cfssljson -bare ca"
  args:
    chdir: "{{CA_DIR}}"

- name: ls for the CA files
  command: ls -la "{{CA_DIR}}"

- shell: (cd "{{CA_DIR}}"; find . -maxdepth 1 -type f) | cut -d'/' -f2
  register: files_to_copy

- fetch: src=/remote/{{ item }} dest="{{CA_DIR_ANSIBLE_LOCAL}}"
  with_items: "{{ files_to_copy.stdout_lines }}"
