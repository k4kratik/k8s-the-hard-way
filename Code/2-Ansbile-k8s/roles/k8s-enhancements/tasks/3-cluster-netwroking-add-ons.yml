# Download and apply manifest
- name: apply weave net
  become: false
  shell: kubectl apply -f "https://cloud.weave.works/k8s/net?k8s-version=$(kubectl version | base64 | tr -d '\n')"
  args:
    executable: /bin/bash

# Download and apply Core DNS manifest
- name: Download Core-DNS manifest to the cluster.
  ansible.builtin.get_url:
    url: https://storage.googleapis.com/kubernetes-the-hard-way/coredns-1.8.yaml
    dest: ~/coredns.yaml
    mode: "0664"

- name: Apply Core-DNS manifest to the cluster.
  community.kubernetes.k8s:
    state: present
    src: ~/coredns.yaml
