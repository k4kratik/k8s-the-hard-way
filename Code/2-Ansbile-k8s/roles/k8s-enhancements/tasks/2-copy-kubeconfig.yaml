- name: get the username
  become: false
  local_action: command whoami
  register: current_username

- name: Creates directory for kubeconfig files
  file:
    path: /home/{{current_username.stdout}}/.kube
    state: directory

- name: Copy the kubeconfig
  copy:
    src: "{{CA_DIR}}/admin.kubeconfig"
    dest: /home/{{current_username.stdout}}/.kube/config
    owner: "{{current_username.stdout}}"
# add group to .kube directory as kubectl get all was giving issues
# https://stackoverflow.com/a/67483114
- name: Ansible replace string from 127.0.0.1 to LB DNS
  replace:
    path: /home/{{current_username.stdout}}/.kube/config
    regexp: "127.0.0.1"
    replace: "{{INTERNAL_K8S_NLB_DNS}}"
