- name: Setting the Cluster
  shell: kubectl config set-cluster kubernetes-the-hard-way --certificate-authority=ca.pem --embed-certs=true --server=https://127.0.0.1:6443 --kubeconfig=kube-scheduler.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Setting the credentials
  shell: kubectl config set-credentials system:node:kube-scheduler --client-certificate=kube-scheduler.pem --client-key=kube-scheduler-key.pem --embed-certs=true --kubeconfig=kube-scheduler.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Setting the context
  shell: kubectl config set-context default --cluster=kubernetes-the-hard-way --user=system:node:kube-scheduler --kubeconfig=kube-scheduler.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Using the default context
  shell: kubectl config use-context default --kubeconfig=kube-scheduler.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
