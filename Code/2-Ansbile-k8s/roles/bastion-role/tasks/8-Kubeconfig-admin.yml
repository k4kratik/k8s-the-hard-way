- name: Setting the Cluster
  shell: kubectl config set-cluster kubernetes-the-hard-way --certificate-authority=ca.pem --embed-certs=true --server=https://127.0.0.1:6443 --kubeconfig=admin.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Setting the credentials
  shell: kubectl config set-credentials system:node:admin --client-certificate=admin.pem --client-key=admin-key.pem --embed-certs=true --kubeconfig=admin.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Setting the context
  shell: kubectl config set-context default --cluster=kubernetes-the-hard-way --user=system:node:admin --kubeconfig=admin.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Using the default context
  shell: kubectl config use-context default --kubeconfig=admin.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
