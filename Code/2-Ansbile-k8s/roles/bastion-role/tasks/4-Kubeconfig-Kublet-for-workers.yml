- name: Setting the Cluster
  shell: kubectl config set-cluster kubernetes-the-hard-way --certificate-authority=ca.pem --embed-certs=true --server=https://{{INTERNAL_K8S_LB_DNS}}:6443 --kubeconfig=k8s-worker-{{item}}.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
  with_sequence: start=0 end={{WORKERS_COUNT - 1}}

- name: Setting the credentials
  shell: kubectl config set-credentials system:node:k8s-worker-{{item}} --client-certificate=k8s-worker-{{item}}.pem --client-key=k8s-worker-{{item}}-key.pem --embed-certs=true --kubeconfig=k8s-worker-{{item}}.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
  with_sequence: start=0 end={{WORKERS_COUNT - 1}}

- name: Setting the context
  shell: kubectl config set-context default --cluster=kubernetes-the-hard-way --user=system:node:k8s-worker-{{item}} --kubeconfig=k8s-worker-{{item}}.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
  with_sequence: start=0 end={{WORKERS_COUNT - 1}}

- name: Using the default context
  shell: kubectl config use-context default --kubeconfig=k8s-worker-{{item}}.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
  with_sequence: start=0 end={{WORKERS_COUNT - 1}}
