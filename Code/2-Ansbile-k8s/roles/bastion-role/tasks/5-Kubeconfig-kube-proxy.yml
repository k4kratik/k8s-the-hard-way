- name: Setting the Cluster
  shell: kubectl config set-cluster kubernetes-the-hard-way --certificate-authority=ca.pem --embed-certs=true --server=https://{{INTERNAL_K8S_NLB_DNS}}:443 --kubeconfig=kube-proxy.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Setting the credentials
  shell: kubectl config set-credentials system:node:kube-proxy --client-certificate=kube-proxy.pem --client-key=kube-proxy-key.pem --embed-certs=true --kubeconfig=kube-proxy.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Setting the context
  shell: kubectl config set-context default --cluster=kubernetes-the-hard-way --user=system:node:kube-proxy --kubeconfig=kube-proxy.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash

- name: Using the default context
  shell: kubectl config use-context default --kubeconfig=kube-proxy.kubeconfig
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
