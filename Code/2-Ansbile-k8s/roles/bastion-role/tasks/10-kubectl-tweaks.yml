- name: Inserting a line in bashrc #? could use some ansible module like - lineinfile or blockinline or something else
  #! Now it is not idempotent, sadly.
  shell: |
    echo 'source <(kubectl completion bash)' >>~/.bashrc
    echo 'alias k=kubectl' >>~/.bashrc
    echo 'complete -F __start_kubectl k' >>~/.bashrc
    echo 'alias c=clear' >>~/.bashrc
    echo 'alias kpo="kubectl get po -A -o wide --show-labels"' >>~/.bashrc
  args:
    chdir: "{{CA_DIR}}"
    executable: /bin/bash
