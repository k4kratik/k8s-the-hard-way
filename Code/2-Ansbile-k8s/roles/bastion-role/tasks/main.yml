---
# tasks file for bastion-role

- name: Download cfssl & cfssljson tool
  become: yes
  get_url:
    url: https://storage.googleapis.com/kubernetes-the-hard-way/cfssl/{{ cfssl_version }}/linux/{{ item }}
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  with_items:
    - cfssl
    - cfssljson

- name: Download kubectl
  become: yes
  get_url:
    url: https://dl.k8s.io/release/{{kubectl_version}}/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Check Versions
  ansible.builtin.script: files/check_versions.sh
  register: script_output

- debug:
    var: script_output.stdout_lines

- include_tasks: 2-Certificate-Authority.yml

- name: Install boto3 python package
  pip:
    name: boto3

