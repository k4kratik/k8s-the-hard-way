- name: Download K8s Server Components
  get_url:
    url: https://storage.googleapis.com/kubernetes-release/release/{{K8S_VERSION}}/bin/linux/amd64/{{item}}
    dest: /usr/local/bin/
    mode: "0755"
  with_items:
    - kube-apiserver
    - kubectl
    - kube-scheduler
    - kube-controller-manager

- name: Creates directory for k8s
  file:
    path: /var/lib/kubernetes/
    state: directory
    mode: 0700

- name: Copying required files to k8s directory
  shell: cp ca.pem ca-key.pem k8s-api-server-key.pem k8s-api-server.pem service-account-key.pem service-account.pem /var/lib/kubernetes/
  args:
    chdir: "{{NODE_CERTS_DIR}}"
    executable: /bin/bash

- name: Copying encryption-config to k8s directory
  shell: cp encryption-config.yaml /var/lib/kubernetes/
  args:
    chdir: "{{NODE_K8S_DIR}}"
    executable: /bin/bash

- name: Copying encryption-config to k8s directory
  shell: cp admin.kubeconfig kube-controller-manager.kubeconfig kube-scheduler.kubeconfig /var/lib/kubernetes/
  args:
    chdir: "{{NODE_KUBECONFIG_DIR}}"
    executable: /bin/bash

- name: Copying the kube-apiserver,kube-controller-manager service file
  template:
    src: "{{item}}"
    dest: /etc/systemd/system/{{item[:-3]}}
    # truncating string so we can remove last .j2 from the file names
  vars:
    INTERNAL_PRIVATE_IP: "{{ ansible_all_ipv4_addresses | ipaddr('private') | first }}"
  with_items:
    - kube-apiserver.service.j2
    - kube-controller-manager.service.j2
    - kube-scheduler.service.j2

- name: Restart services, also issue daemon-reload to pick up config changes
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: yes
    name: "{{item}}"
    enabled: yes
  with_items:
    - kube-apiserver.service
    - kube-controller-manager.service
    - kube-scheduler.service
